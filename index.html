function renderMission() {
  const c = getChallengeById(state.currentId);
  if (!c) return renderDashboard();
  const hints = c.hints || [];
  const canReveal = state.hintLevel >= hints.length;
  const history = state.queryHistory[c.id] || [];
  const result = state.attemptResult;
  const isSolved = isCompleted(c.id);

  let feedbackHtml = '';
  if (state.lastRunError) {
    feedbackHtml = `
    <div class="feedback fail">
      <div class="feedback-head">⚠️ QUERY FAILED TO RUN</div>
      <div class="feedback-body">Your query has a syntax or logic error the engine could not evaluate:</div>
      <pre class="err-msg">${esc(state.lastRunError)}</pre>
      <div class="feedback-tip">Check operator spelling, matching parentheses/quotes, and that every stage after the first starts with a recognized operator.</div>
    </div>`;
  } else if (result) {
    if (result.status === 'success') {
      const rec = state.player.completed[c.id];
      const xpGain = rec ? rec.xpEarned : c.xp;
      feedbackHtml = `
      <div class="feedback success">
        <div class="feedback-head">🎉 MISSION COMPLETE! <span class="float-xp">+${xpGain} XP</span></div>
        <div class="feedback-body">Excellent work, Analyst. Your query correctly answers the investigation question.</div>
      </div>`;
    } else if (result.status === 'empty') {
      feedbackHtml = `
      <div class="feedback warn">
        <div class="feedback-head">🕳️ EMPTY RESULT</div>
        <div class="feedback-body">Your query ran successfully but returned <b>zero rows</b>, and we expected to find something. Your filter logic is likely too strict, or checking the wrong field/value.</div>
      </div>`;
    } else if (result.status === 'partial_over') {
      feedbackHtml = `
      <div class="feedback warn">
        <div class="feedback-head">🟡 PARTIALLY CORRECT — TOO BROAD</div>
        <div class="feedback-body">You found every record you needed to (${result.matched}/${result.expected}) — but also ${result.got - result.matched} extra ones that shouldn't be there. You're probably missing an additional filter condition (a time window, a threshold, or a second <code>where</code>).</div>
      </div>`;
    } else if (result.status === 'partial_under') {
      feedbackHtml = `
      <div class="feedback warn">
        <div class="feedback-head">🟡 PARTIALLY CORRECT — TOO NARROW</div>
        <div class="feedback-body">You correctly identified ${result.matched} of ${result.expected} matching records, but missed the rest. Your filter is likely more restrictive than the question actually asks for.</div>
      </div>`;
    } else {
      feedbackHtml = `
      <div class="feedback fail">
        <div class="feedback-head">❌ QUERY DID NOT SOLVE THE MISSION</div>
        <div class="feedback-body">Your query ran without error and returned ${result.got} row(s), but it doesn't answer the investigation question — ${result.matched}/${result.expected} expected records were found. Re-read the objective and think through: what table, what field, what condition?</div>
      </div>`;
    }
  }

  let hintsHtml = '';
  if (hints.length) {
    hintsHtml = `<div class="hints-panel">
      <div class="hints-head">💡 HINTS (${state.hintLevel}/${hints.length} used)</div>
      ${hints.slice(0, state.hintLevel).map((h, i) => `<div class="hint-line"><b>Hint ${i + 1}:</b> ${esc(h)}</div>`).join('')}
      <div class="hints-actions">
        ${state.hintLevel < hints.length ? `<button class="btn btn-ghost" data-action="get-hint">Get Hint (${state.hintLevel + 1}/${hints.length})</button>` : ''}
        ${canReveal && !state.showSolution ? `<button class="btn btn-ghost danger" data-action="reveal-solution">🔓 Reveal Solution</button>` : ''}
      </div>
      ${state.showSolution ? `<div class="solution-box"><b>SOLUTION:</b><pre>${esc(c.solutionQuery)}</pre></div>` : ''}
    </div>`;
  }

  let explainHtml = '';
  if (isSolved || state.showSolution) {
    const steps = explainQuery(c.solutionQuery);
    explainHtml = `<div class="explain-panel">
      <div class="explain-head">🧠 EXPLAIN THIS QUERY</div>
      ${steps.map((s, i) => `<div class="explain-line"><span class="explain-idx">${i + 1}</span><code>${esc(s.stage)}</code><div class="explain-desc">${esc(s.desc)}</div></div>`).join('')}
      ${c.explainNote ? `<div class="explain-note">📎 ${esc(c.explainNote)}</div>` : ''}
    </div>`;
  }

  let resultsHtml = '';
  if (state.lastRunRows) {
    resultsHtml = renderResultsTable(state.lastRunRows);
  }

  const datasets = (c.dataset || '').split('+').map(s => s.trim());
  const colsHtml = datasets.map(d => `<div class="ds-chip">${esc(d)}<div class="ds-cols">${(TABLE_COLUMNS[d] || []).join(', ')}</div></div>`).join('');

  const newBadgeModal = state._newBadges && state._newBadges.length ? renderBadgeModal(state._newBadges) : '';
  const levelUpModal = state.levelUpFrom ? renderLevelUpModal() : '';

  // step tracker: dots for every step in this module, so the player can see the whole arc
  let stepTrackerHtml = '';
  if (c.totalSteps > 1) {
    const steps = stepsOfModule(c.moduleId);
    stepTrackerHtml = `<div class="step-tracker">
      ${steps.map((s, i) => {
        const st = isCompleted(s.id) ? 'done' : s.id === c.id ? 'current' : (i < c.stepIndex ? 'done' : 'upcoming');
        return `<div class="step-dot ${st}" title="Step ${i + 1}">${st === 'done' ? '✓' : i + 1}</div>${i < steps.length - 1 ? '<div class="step-line"></div>' : ''}`;
      }).join('')}
    </div>`;
  }
  const showFullIntro = c.stepIndex === 0 || c.review;
  const introBlock = showFullIntro
    ? `<div class="briefing-story">${nl2br(c.moduleIntro || '')}</div>`
    : `<div class="briefing-recap">📂 ${esc(c.moduleTitle)} — continuing where you left off. <span class="recap-hint">🔧 Extend the query below.</span></div>`;

  return `
  <div class="mission-view ${c.boss ? 'boss-bg' : ''}">
    <div class="mission-briefing">
      <div class="briefing-top">
        <button class="btn btn-ghost small" data-action="goto-dashboard">← Mission Control</button>
        <span class="mission-tag">${c.boss ? '👾 BOSS BATTLE' : (c.review ? '🧠 REVIEW MISSION' : `LEVEL ${c.level}`)}</span>
      </div>
      <div class="briefing-code">${esc(c.moduleCodename || '')}</div>
      <h2 class="briefing-title">${esc(c.moduleTitle)}</h2>
      ${stepTrackerHtml}
      <div class="briefing-meta">
        <span>${starRow(c.difficulty || 2)}</span>
        <span>+${c.xp} XP</span>
        ${isSolved ? '<span class="tag-done">✅ SOLVED</span>' : ''}
      </div>
      ${introBlock}
      <div class="briefing-objective"><b>🎯 ${c.totalSteps > 1 ? `STEP ${c.stepIndex + 1}:` : 'OBJECTIVE:'}</b> ${esc(c.objective)}</div>
      ${c.thinkThrough && c.thinkThrough.length ? `<div class="think-through"><b>Think it through:</b><ul>${c.thinkThrough.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
      <div class="ds-chips">${colsHtml}</div>
      ${hintsHtml}
      ${explainHtml}
    </div>
    <div class="mission-workbench">
      <div class="editor-toolbar">
        <button class="btn btn-primary" data-action="run-query">▶ RUN QUERY</button>
        <button class="btn btn-ghost" data-action="format-query">🧹 Format</button>
        <button class="btn btn-ghost" data-action="reset-query">🔄 Reset</button>
        <button class="btn btn-ghost" data-action="copy-query">📋 Copy</button>
        ${isSolved ? `<button class="btn btn-secondary" data-action="next-mission">Continue →</button>` : ''}
        ${history.length ? `<select class="history-select" data-action="load-history"><option value="">History (${history.length})</option>${history.map((q, i) => `<option value="${i}">${esc(q.slice(0, 40))}</option>`).join('')}</select>` : ''}
      </div>
      <div class="chip-row">${quickInsertChips(datasets)}</div>
      <div class="editor-wrap">
        <div class="editor-gutter" id="editor-gutter">1</div>
        <textarea id="kql-editor" class="editor-input" spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="Write your KQL query here...">${esc(state._draftQuery || '')}</textarea>
      </div>
      <div class="results-area">${feedbackHtml}${resultsHtml}</div>
    </div>
  </div>
  ${newBadgeModal}${levelUpModal}`;
}

function quickInsertChips(datasets) {
  const ops = ['where', 'project', 'extend', 'summarize ... by', 'count()', 'countif()', 'dcount()', 'distinct', 'sort by ... desc', 'take 10', 'ago(24h)', 'contains', 'has', 'join kind=inner () on'];
  let cols = [];
  datasets.forEach(d => { cols = cols.concat(TABLE_COLUMNS[d] || []); });
  const items = [...ops.map(o => ({ t: o, k: 'op' })), ...cols.map(c => ({ t: c, k: 'col' }))];
  return items.map(i => `<button class="chip chip-${i.k}" data-action="insert-chip" data-val="${esc(i.t)}">${esc(i.t)}</button>`).join('');
}

function renderResultsTable(rows) {
  if (!rows || rows.length === 0) {
    return `<div class="results-table-wrap"><div class="results-empty">Query executed. 0 rows returned.</div></div>`;
  }
  const cols = Object.keys(rows[0]).filter(k => k !== '__rid');
  const shown = rows.slice(0, 50);
  return `<div class="results-table-wrap">
    <div class="results-count">${rows.length} row${rows.length === 1 ? '' : 's'} returned${rows.length > 50 ? ' (showing first 50)' : ''}</div>
    <div class="table-scroll"><table class="results-table"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${shown.map(r => `<tr>${cols.map(c => `<td>${esc(formatCell(r[c]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  </div>`;
}
function formatCell(v) {
  if (v instanceof Date) return v.toISOString().replace('T', ' ').slice(0, 19);
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (v && typeof v === 'object') return JSON.stringify(v);
  return v;
}

function renderBadgeModal(badges) {
  const b = badges[0];
  return `<div class="modal-overlay" data-action="dismiss-badge">

// ---------------- KQL editor (plain, reliable — no HTML-overlay highlighting) ----------------
// ---------------- IntelliSense-style autocomplete (Sentinel/KQL-editor-like) ----------------
const KQL_OP_SUGGESTIONS = ['where', 'project', 'project-away', 'project-rename', 'extend', 'summarize', 'distinct', 'sort by', 'order by', 'take', 'limit', 'top', 'count', 'join', 'union', 'mv-expand', 'let', 'search'].map(l => ({ label: l, type: 'op' }));
const KQL_KW_SUGGESTIONS = ['and', 'or', 'not', 'in', 'asc', 'desc', 'by', 'kind=inner', 'kind=leftouter', 'kind=leftanti', 'contains', 'has', 'startswith', 'endswith'].map(l => ({ label: l, type: 'kw' }));
const KQL_FN_SUGGESTIONS = ['ago(', 'now()', 'count()', 'countif(', 'dcount(', 'avg(', 'min(', 'max(', 'sum(', 'bin(', 'tolower(', 'toupper(', 'isempty(', 'isnotempty(', 'strcat(', 'strlen(', 'tostring(', 'toint(', 'toreal(', 'todatetime(', 'parse_json(', 'iff(', 'case(', 'split(', 'dynamic(', 'round(', 'abs('].map(l => ({ label: l, type: 'fn' }));
const KQL_TABLE_SUGGESTIONS = Object.keys(TABLE_COLUMNS).map(l => ({ label: l, type: 'table' }));
const SUGGEST_TYPE_TAG = { op: 'OP', kw: 'KW', fn: 'FN', col: 'COL', table: 'TBL' };

function currentTokenAt(text, caret) {
  let start = caret;
  while (start > 0 && /[A-Za-z0-9_.\-]/.test(text[start - 1])) start--;
  return { start, token: text.slice(start, caret) };
}
function computeSuggestions(text, caret, datasets) {
  const upToCaret = text.slice(0, caret);
  const { start, token } = currentTokenAt(text, caret);
  const beforeToken = upToCaret.slice(0, start);
  const isFirstToken = !/\|/.test(beforeToken) && beforeToken.trim() === '';
  let pool;
  if (isFirstToken) {
    pool = KQL_TABLE_SUGGESTIONS;
  } else {
    const cols = [];
    (datasets || []).forEach(d => (TABLE_COLUMNS[d] || []).forEach(c => cols.push({ label: c, type: 'col' })));
    pool = [...cols, ...KQL_OP_SUGGESTIONS, ...KQL_KW_SUGGESTIONS, ...KQL_FN_SUGGESTIONS];
  }
  if (!token) return { start, end: caret, items: [] };
  const lower = token.toLowerCase();
  const seen = new Set();
  const items = [];
  for (const p of pool) {
    if (p.label.toLowerCase().startsWith(lower) && !seen.has(p.label)) {
      seen.add(p.label); items.push(p);
      if (items.length >= 8) break;
    }
  }
  return { start, end: caret, items };
}
function getCaretPixelPos(textarea, position) {
  const div = document.createElement('div');
  const cs = window.getComputedStyle(textarea);
  ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 'lineHeight', 'wordSpacing'].forEach(p => { div.style[p] = cs[p]; });
  div.style.position = 'absolute';
  div.style.visibility = 'hidden';
  div.style.top = '-9999px';
  div.style.left = '-9999px';
  div.style.whiteSpace = 'pre-wrap';
  div.style.wordWrap = 'break-word';
  document.body.appendChild(div);
  div.textContent = textarea.value.slice(0, position);
  const span = document.createElement('span');
  span.textContent = textarea.value.slice(position) || '.';
  div.appendChild(span);
  const rect = textarea.getBoundingClientRect();
  const top = span.offsetTop - textarea.scrollTop;
  const left = span.offsetLeft - textarea.scrollLeft;
  document.body.removeChild(div);
  return { top: rect.top + top, left: rect.left + left };
}
let suggestState = { items: [], index: 0, start: 0, end: 0 };
function ensureSuggestBox() {
  let box = document.getElementById('kql-suggest-box');
  if (!box) { box = document.createElement('div'); box.id = 'kql-suggest-box'; box.className = 'suggest-box'; document.body.appendChild(box); }
  return box;
}
function hideSuggestions() {
  const box = document.getElementById('kql-suggest-box');
  if (box) box.style.display = 'none';
  suggestState.items = [];
}
function renderSuggestBox(ta) {
  const box = ensureSuggestBox();
  if (!suggestState.items.length) { box.style.display = 'none'; return; }
  const pos = getCaretPixelPos(ta, suggestState.end);
  box.style.left = pos.left + 'px';
  box.style.top = (pos.top + 22) + 'px';
  box.innerHTML = suggestState.items.map((it, i) => `
    <div class="suggest-item ${i === suggestState.index ? 'active' : ''}" data-idx="${i}">
      <span class="suggest-type suggest-type-${it.type}">${SUGGEST_TYPE_TAG[it.type]}</span>
      <span class="suggest-label">${esc(it.label)}</span>
    </div>`).join('') + `<div class="suggest-footer">↑↓ navigate · Tab/Enter accept · Esc dismiss</div>`;
  box.style.display = 'block';
  box.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('mousedown', (e) => { e.preventDefault(); suggestState.index = +el.dataset.idx; acceptSuggestion(ta); });
  });
}
function acceptSuggestion(ta) {
  const item = suggestState.items[suggestState.index];
  if (!item) return;
  const before = ta.value.slice(0, suggestState.start);
  const after = ta.value.slice(suggestState.end);
  let insertText = item.label;
  if (item.type === 'op') {
    // Operators start a new pipeline stage — if the user hasn't typed a leading '|' yet
    // (e.g. they just pressed Enter to a new line), add one automatically so accepting a
    // suggestion can never silently produce an invalid query.
    const trimmedBefore = before.replace(/\s+$/, '');
    const needsPipe = trimmedBefore.length > 0 && !trimmedBefore.endsWith('|');
    if (needsPipe) insertText = '| ' + insertText;
  }
  if (item.type === 'op' || item.type === 'kw' || item.type === 'table') insertText += ' ';
  ta.value = before + insertText + after;
  const newCaret = (before + insertText).length;
  ta.selectionStart = ta.selectionEnd = newCaret;
  hideSuggestions();
  ta.dispatchEvent(new Event('input'));
  ta.focus();
}
function updateSuggestions(ta, getDatasets) {
  const caret = ta.selectionStart;
  const result = computeSuggestions(ta.value, caret, getDatasets());
  suggestState = { items: result.items, index: 0, start: result.start, end: result.end };
  renderSuggestBox(ta);
}

// ---------------- shared KQL editor wiring (used by mission editor and case-file editor) ----------------
function setupKqlEditor(taId, gutterId, getDatasets, onDraftChange, runActionName) {
  const ta = document.getElementById(taId);
  const gutter = document.getElementById(gutterId);
  if (!ta) return;
  function sync() {
    const lines = ta.value.split('\n').length;
    gutter.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
    if (onDraftChange) onDraftChange(ta.value);
    updateSuggestions(ta, getDatasets);
  }
  ta.addEventListener('input', sync);
  ta.addEventListener('click', () => updateSuggestions(ta, getDatasets));
  ta.addEventListener('keyup', (e) => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) updateSuggestions(ta, getDatasets); });
  ta.addEventListener('scroll', () => { gutter.scrollTop = ta.scrollTop; hideSuggestions(); });
  ta.addEventListener('blur', () => setTimeout(hideSuggestions, 120));
  ta.addEventListener('keydown', (e) => {
    if (suggestState.items.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); suggestState.index = (suggestState.index + 1) % suggestState.items.length; renderSuggestBox(ta); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); suggestState.index = (suggestState.index - 1 + suggestState.items.length) % suggestState.items.length; renderSuggestBox(ta); return; }
      if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); acceptSuggestion(ta); return; }
      if (e.key === 'Escape') { hideSuggestions(); return; }
    }
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart, en = ta.selectionEnd; ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en); ta.selectionStart = ta.selectionEnd = s + 2; sync(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); hideSuggestions(); doAction(runActionName); }
  });
  sync();
  ta.focus();
}

function setupDailyEditor() {
  setupKqlEditor('daily-editor', 'daily-editor-gutter', () => {
    const q = getDailyQuestForDate(new Date().toISOString().slice(0, 10));
    return (q.dataset || '').split('+').map(s => s.trim());
  }, (v) => { state._dailyDraftQuery = v; }, 'run-daily-quest');
}

function insertAtCursor(text, taId) {
  const ta = document.getElementById(taId || 'kql-editor');
  if (!ta) return;
  const s = ta.selectionStart, en = ta.selectionEnd;
  const before = ta.value.slice(0, s), after = ta.value.slice(en);
  const needsPipe = before.trim().length > 0 && !before.trim().endsWith('|') && /^(where|project|extend|summarize|distinct|sort|order|take|limit|top|count|join|union|mv-expand|search)/i.test(text);
  const insert = needsPipe ? `\n| ${text}` : text;
  ta.value = before + insert + after;
  ta.selectionStart = ta.selectionEnd = (before + insert).length;
  ta.dispatchEvent(new Event('input'));
  ta.focus();
}

function formatQuery(code) {
  return code.split('|').map(s => s.trim()).filter(Boolean).join('\n| ');
}

// ---------------- event wiring ----------------
function wireEvents() {
  $app().onclick = (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    doAction(el.dataset.action, el);
  };
  $app().onkeydown = (e) => {
    if (e.key === 'Enter' && e.target.id === 'callsign-input') doAction('begin-training');
  };
  const historySelect = document.querySelector('[data-action="load-history"]');
  if (historySelect) historySelect.onchange = (e) => {
    const idx = e.target.value;
    if (idx === '') return;
    const q = (state.queryHistory[state.currentId] || [])[+idx];
    const ta = document.getElementById('kql-editor');
    ta.value = q;
    ta.dispatchEvent(new Event('input'));
  };
}

function goToMission(id) {
  state.currentId = id;
  state.hintLevel = 0;
  state.attemptResult = null;
  state.lastRunRows = null;
  state.lastRunError = null;
  state.showSolution = false;
  state._newBadges = null;
  state.levelUpFrom = null;
  const c = getChallengeById(id);
  state._draftQuery = priorQueryForStep(c);
  // If we carried a query over from the previous step in this module, show its results
  // immediately instead of leaving the results panel blank until the player re-runs it.
  if (state._draftQuery) {
    try { state.lastRunRows = runQuery(state._draftQuery, DB, SESSION_NOW); }
    catch (e) { state.lastRunRows = null; }
  }
  state.screen = 'mission';
}

// Open a module: jump straight to its first not-yet-completed step (or its last step,
// read-only-ish, if every step is already done — useful for revisiting a finished module).
function startModule(moduleId) {
  const steps = stepsOfModule(moduleId);
  const next = steps.find(s => !isCompleted(s.id));
  goToMission(next ? next.id : steps[steps.length - 1].id);
}

function doAction(action, el) {
  switch (action) {
    case 'begin-training': {
      const input = document.getElementById('callsign-input');
      state.player.name = (input && input.value.trim()) || 'ANALYST';
      savePlayer();
      state.screen = 'dashboard';
      state.dashboardTab = 'training';
      render();
      break;
    }
    case 'goto-dashboard': state.screen = 'dashboard'; render(); break;
    case 'dash-tab': state.dashboardTab = el.dataset.tab; render(); break;
    case 'goto-profile': state.screen = 'profile'; render(); break;
    case 'goto-badges': state.screen = 'badges'; render(); break;
    case 'goto-skilltree': state.screen = 'skilltree'; render(); break;
    case 'goto-casefiles': state.screen = 'dashboard'; state.dashboardTab = 'casefiles'; render(); break;
    case 'open-casefile': {
      state.currentCaseId = el.dataset.id;
      state.caseLastRows = null; state.caseLastError = null; state.caseGrade = null; state.caseShowAnswers = false;
      state._caseDraftQuery = '';
      state._newBadges = null;
      state.screen = 'casefile';
      render();
      break;
    }
    case 'run-case-query': {
      const ta = document.getElementById('case-editor');
      runCaseQuery(ta ? ta.value : '');
      render();
      break;
    }
    case 'format-case-query': {
      const ta = document.getElementById('case-editor');
      if (ta) { ta.value = formatQuery(ta.value); ta.dispatchEvent(new Event('input')); }
      break;
    }
    case 'reset-case-query': { state._caseDraftQuery = ''; render(); break; }
    case 'submit-case-answers': submitCaseAnswers(); render(); break;
    case 'toggle-case-answers': state.caseShowAnswers = !state.caseShowAnswers; render(); break;
    case 'toggle-mute': state.player.muted = !state.player.muted; savePlayer(); render(); break;
    case 'open-reset-confirm': state.showResetConfirm = true; render(); break;
    case 'cancel-reset': state.showResetConfirm = false; render(); break;
    case 'confirm-reset': resetProgress().then(render); break;
    case 'start-mission': goToMission(el.dataset.id); render(); break;
    case 'start-module': startModule(el.dataset.id); render(); break;
    case 'do-daily': {
      state.dailyHintLevel = 0;
      state.dailyLastRows = null;
      state.dailyLastError = null;
      state.dailyAttemptResult = null;
      state.dailyShowSolution = false;
      state.dailyXpAwarded = null;
      state._dailyDraftQuery = '';
      state._newBadges = null;
      state.levelUpFrom = null;
      state.screen = 'daily-quest';
      render();
      break;
    }
    case 'run-daily-quest': submitDailyQuest(); render(); break;
    case 'get-daily-hint': {
      const q = getDailyQuestForDate(new Date().toISOString().slice(0, 10));
      if (state.dailyHintLevel < (q.hints || []).length) state.dailyHintLevel++;
      render(); setTimeout(setupDailyEditor, 0);
      break;
    }
    case 'reveal-daily-solution': state.dailyShowSolution = true; render(); setTimeout(setupDailyEditor, 0); break;
    case 'reset-daily-query': { state._dailyDraftQuery = ''; render(); break; }
    case 'format-daily-query': {
      const ta = document.getElementById('daily-editor');
      if (ta) { ta.value = formatQuery(ta.value); ta.dispatchEvent(new Event('input')); }
      break;
    }
    case 'run-query': submitMission(); render(); break;
    case 'get-hint': useHint(); render(); setTimeout(setupEditor, 0); break;
    case 'reveal-solution': revealSolution(); render(); setTimeout(setupEditor, 0); break;
    case 'reset-query': { state._draftQuery = priorQueryForStep(getChallengeById(state.currentId)); render(); break; }
    case 'copy-query': {
      const ta = document.getElementById('kql-editor');
      if (ta) { navigator.clipboard && navigator.clipboard.writeText(ta.value).catch(() => {}); }
      break;
    }
    case 'format-query': {
      const ta = document.getElementById('kql-editor');
      if (ta) { ta.value = formatQuery(ta.value); ta.dispatchEvent(new Event('input')); }
      break;
    }
    case 'insert-chip': insertAtCursor(el.dataset.val); break;
    case 'next-mission': {
      const nm = nextMissionId();
      if (nm) { goToMission(nm); render(); }
      else { state.screen = 'dashboard'; state.dashboardTab = 'training'; render(); }
      break;
    }
    case 'dismiss-badge': {
      state._newBadges = state._newBadges ? state._newBadges.slice(1) : null;
      if (state._newBadges && state._newBadges.length === 0) state._newBadges = null;
      render(); setTimeout(setupEditor, 0);
      break;
    }
    case 'dismiss-levelup': state.levelUpFrom = null; render(); setTimeout(setupEditor, 0); break;
  }
}

function render() {
  if (typeof hideSuggestions === 'function') hideSuggestions();
  let inner = '';
  const resetModal = state.showResetConfirm ? renderResetConfirmModal() : '';
  if (state.screen === 'onboarding') {
    inner = renderOnboarding();
    $app().innerHTML = inner + resetModal;
    wireEvents();
    return;
  }
  const hud = renderHud();
  if (state.screen === 'dashboard') inner = renderDashboard();
  else if (state.screen === 'mission') inner = renderMission();
  else if (state.screen === 'profile') inner = renderProfile();
  else if (state.screen === 'badges') inner = renderBadges();
  else if (state.screen === 'skilltree') inner = renderSkillTree();
  else if (state.screen === 'casefile') inner = renderCaseFile();
  else if (state.screen === 'daily-quest') inner = renderDailyQuestScreen();
  $app().innerHTML = hud + `<div class="screen-body">${inner}</div>` + resetModal;
  wireEvents();
  if (state.screen === 'mission') setupEditor();
  if (state.screen === 'casefile') setupCaseEditor();
  if (state.screen === 'daily-quest') setupDailyEditor();
}

// ============================================================
// BOOTSTRAP
// ============================================================
async function main() {
  const loaded = await loadPlayer();
  state.player = loaded || freshPlayer();
  // backfill any missing fields for players saved by an earlier version of the schema
  const fresh = freshPlayer();
  Object.keys(fresh).forEach(k => { if (state.player[k] === undefined) state.player[k] = fresh[k]; });
  state.screen = state.player.name ? 'dashboard' : 'onboarding';
  render();
}

main();

// Expose a small debug surface (useful for QA and for curious analysts poking the console).
window.KQLQUEST_DEBUG = { state, ALL_STEPS, ALL_MODULES, CASE_FILES, REVIEW_TEMPLATES, DAILY_QUEST_POOL, getDailyQuestForDate, DB, submitMission, goToMission, startModule, resetProgress, submitCaseAnswers, gradeCaseQuestion, runCaseQuery, submitDailyQuest, render, runQuery, gradeResult, useHint, revealSolution };

</script>
